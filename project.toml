[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connected-edge-drop"
version = "0.1.0"
description = "A replacement for torch_geometric's edge_drop that preserves graph connectivity"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.0",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/patrickstinson/connected-edge-drop"